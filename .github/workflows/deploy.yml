name: Deploy

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/kyntfkc/gram-hesap

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install deps
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
    steps:
      - name: Skip if VPS secrets missing
        if: env.VPS_HOST == ''
        run: echo "VPS_HOST secret tanımlı değil — deploy atlandı (image GHCR'de hazır)."

      - name: Deploy on VPS
        if: env.VPS_HOST != ''
        uses: appleboy/ssh-action@v1.2.0
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: GHCR_TOKEN
          script: |
            set -e
            cd /opt/gram-hesap
            echo "$GHCR_TOKEN" | docker login ghcr.io -u kyntfkc --password-stdin

            # Önceki image'ı geri dönüş için koru
            PREV_IMAGE_ID=$(docker inspect --format='{{.Image}}' gram-hesap-app-1 2>/dev/null || true)
            if [ -n "$PREV_IMAGE_ID" ]; then
              docker tag "$PREV_IMAGE_ID" ghcr.io/kyntfkc/gram-hesap:rollback || true
            fi

            docker compose pull app
            docker compose up -d --no-build app

            for i in $(seq 1 30); do
              health=$(docker inspect --format='{{.State.Health.Status}}' gram-hesap-app-1 2>/dev/null || echo unknown)
              echo "[wait] app health=$health ($i/30)"
              [ "$health" = "healthy" ] && break
              sleep 2
            done
            if [ "$health" != "healthy" ]; then
              docker compose logs --tail=80 app || true
              exit 1
            fi

            sh deploy/ensure-caddy-gramhesap.sh || true

            docker images ghcr.io/kyntfkc/gram-hesap --format '{{.Repository}}:{{.Tag}}' \
              | grep -vE ':(latest|rollback)$' \
              | grep -v '<none>' \
              | while read -r img; do docker rmi -f "$img" 2>/dev/null || true; done
            docker image prune -f || true
            docker logout ghcr.io || true
