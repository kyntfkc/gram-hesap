name: gram-hesap

services:
  app:
    image: ghcr.io/kyntfkc/gram-hesap:latest
    build: .
    container_name: gram-hesap-app-1
    restart: unless-stopped
    env_file: .env
    environment:
      PORT: "3000"
      HOSTNAME: 0.0.0.0
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/giris').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 20s
    networks:
      - default
      - atolye_stok

networks:
  atolye_stok:
    external: true
    name: atolye-stok_default
